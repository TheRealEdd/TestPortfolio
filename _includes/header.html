<header class="site-header">
    <nav class="navbar" aria-label="Main navigation">

      <!-- Mobile menu button -->
      <button
        class="menu-toggle"
        id="menu-toggle"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="mobile-menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      
      <!-- Centred logo -->
      <a
        class="site-logo"
        href="{{ '/' | relative_url }}"
        aria-label="EHR Design & Creation home"
      >
        <img
          src="{{ '/assets/images/ehrlogo.svg' | relative_url }}"
          alt="EHR Design & Creation"
        >
      </a>


      <!-- Desktop actions -->
      <div class="nav-actions desktop-actions">
        <button
          class="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          title="Toggle colour theme"
        >
          <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
          </svg>
        </button>

        <a
          class="icon-link"
          href="https://www.instagram.com/edwardrocca/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit Instagram (opens in a new tab)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle class="icon-fill" cx="18" cy="6" r="1"></circle>
          </svg>
        </a>
      </div>

      <!-- Mobile menu -->
      <div class="mobile-menu" id="mobile-menu" hidden>
        <button
          class="theme-toggle menu-item"
          type="button"
          aria-label="Switch to dark mode"
        >
          <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
          </svg>
          <span class="theme-label">Dark mode</span>
        </button>

        <a
          class="menu-item"
          href="https://www.instagram.com/edwardrocca/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle class="icon-fill" cx="18" cy="6" r="1"></circle>
          </svg>
          Instagram
        </a>
      </div>
    </nav>
  </header>
