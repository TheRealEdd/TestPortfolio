media:
  - name: originals
    label: Photography originals
    input: media/photography/originals
    output: /media/photography/originals
    categories: [image]
    extensions: [jpg, jpeg, png, webp, tif, tiff]

content:
  - name: photography
    label: Photography gallery
    type: file
    path: _data/photography.yml
    format: yaml
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date

      - name: image
        label: Original image
        type: image
        required: true
        options:
          media: originals

      - name: alt
        label: Image description (alt text)
        type: string
        required: true

      - name: category
        label: Category
        type: string

      - name: description
        label: Description
        type: rich-text

      - name: featured
        label: Featured
        type: boolean

      - name: order
        label: Display order
        type: number